<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollRot Promo - Pomodoro</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1280px;
        height: 800px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        padding: 60px;
        position: relative;
        overflow: hidden;
      }

      /* Static Bubbles */
      body::before {
        content: "";
        position: absolute;
        width: 320px;
        height: 320px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        top: -120px;
        left: -120px;
      }

      body::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 50%;
        bottom: -90px;
        right: -90px;
      }

      .bubble {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }

      .bubble:nth-child(1) {
        width: 180px;
        height: 180px;
        top: 40%;
        right: -90px;
      }

      .bubble:nth-child(2) {
        width: 280px;
        height: 280px;
        bottom: 120px;
        left: -140px;
        background: rgba(255, 255, 255, 0.1);
      }

      .bubble:nth-child(3) {
        width: 160px;
        height: 160px;
        top: 15%;
        left: 20%;
        background: rgba(255, 255, 255, 0.07);
      }

      .bubble:nth-child(4) {
        width: 200px;
        height: 200px;
        bottom: 25%;
        right: 25%;
        background: rgba(255, 255, 255, 0.06);
      }

      .container {
        display: flex;
        align-items: center;
        gap: 60px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .screenshot-placeholder {
        width: 450px;
        height: 650px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px dashed rgba(255, 255, 255, 0.4);
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .screenshot-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 17px;
      }

      .placeholder-text {
        color: rgba(255, 255, 255, 0.6);
        font-size: 24px;
        font-weight: 600;
        text-align: center;
      }

      .right-content {
        flex: 1;
        color: white;
      }

      .icon {
        font-size: 80px;
        margin-bottom: 30px;
      }

      h1 {
        font-size: 64px;
        font-weight: 800;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        line-height: 1.2;
      }

      .description {
        font-size: 32px;
        font-weight: 500;
        margin-bottom: 40px;
        opacity: 0.95;
        line-height: 1.4;
      }

      .features {
        font-size: 26px;
        line-height: 1.8;
      }

      .features li {
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .features li::before {
        content: "✓";
        font-size: 32px;
        font-weight: 900;
      }

      .borderradius25 {
        border-radius: 25px;
      }
    </style>
  </head>
  <body>
    <!-- Static Bubbles -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="container">
      <div class="right-content">
        <div class="icon">🍅</div>
        <h1>Focus Mode:<br />Zero Distractions</h1>
        <div class="description">Complete lockout during work sessions</div>
        <ul class="features">
          <li>Pomodoro timer with custom intervals</li>
          <li>Blocks all short-form content</li>
          <li>Automatic break reminders</li>
          <li>Stay productive without temptation</li>
        </ul>
      </div>
      <img
        src="./screenshots/pomodoro.png"
        alt="Pomodoro Timer"
        height="600px"
        class="borderradius25"
      />
    </div>
  </body>
</html>
