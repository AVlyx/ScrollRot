<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollRot Promo 4</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1280px;
        height: 800px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      .container {
        text-align: center;
        color: white;
        padding: 60px;
        max-width: 1000px;
      }

      .icon {
        font-size: 140px;
        margin-bottom: 40px;
        filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.3));
      }

      h1 {
        font-size: 72px;
        font-weight: 800;
        margin-bottom: 30px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .description {
        font-size: 38px;
        font-weight: 500;
        margin-bottom: 60px;
        opacity: 0.95;
        line-height: 1.4;
      }

      .features-list {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px 60px;
        text-align: left;
        display: inline-block;
      }

      .feature-item {
        font-size: 32px;
        font-weight: 600;
        margin: 20px 0;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .feature-item::before {
        content: "✓";
        font-size: 40px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🍅</div>
      <h1>Pomodoro Focus Mode</h1>
      <div class="description">Complete lockout when you need to concentrate</div>

      <div class="features-list">
        <div class="feature-item">Block all short-form content</div>
        <div class="feature-item">Customizable work intervals</div>
        <div class="feature-item">Built-in break reminders</div>
        <div class="feature-item">No willpower required</div>
      </div>
    </div>
  </body>
</html>
