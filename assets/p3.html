<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollRot Promo - Focus Blocking</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1280px;
        height: 800px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #59a8dc 0%, #d8d1fa 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        padding: 50px;
        position: relative;
        overflow: hidden;
      }

      /* Static Bubbles */
      body::before {
        content: "";
        position: absolute;
        width: 350px;
        height: 350px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        top: -150px;
        right: -150px;
      }

      body::after {
        content: "";
        position: absolute;
        width: 250px;
        height: 250px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        bottom: -100px;
        left: -100px;
      }

      .bubble {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
      }

      .bubble:nth-child(1) {
        width: 200px;
        height: 200px;
        top: 30%;
        left: -100px;
      }

      .bubble:nth-child(2) {
        width: 180px;
        height: 180px;
        bottom: 20%;
        right: -90px;
        background: rgba(255, 255, 255, 0.07);
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
        position: relative;
        z-index: 1;
      }

      .icon {
        font-size: 80px;
        margin-bottom: 20px;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      }

      h1 {
        font-size: 58px;
        font-weight: 800;
        margin-bottom: 15px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        line-height: 1.2;
      }

      .subtitle {
        font-size: 30px;
        font-weight: 500;
        opacity: 0.95;
      }

      .screenshot-container {
        width: 100%;
        max-width: 1100px;
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .badge {
        position: absolute;
        top: -15px;
        right: 30px;
        background: rgba(255, 59, 48, 0.9);
        color: white;
        padding: 12px 30px;
        border-radius: 25px;
        font-size: 20px;
        font-weight: 700;
        box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .borderradius20 {
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Static Bubbles -->
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="header">
      <h1>🔒 No Escape During Focus Time</h1>
      <div class="subtitle">Complete content blocking when you need it most</div>
    </div>

    <div class="screenshot-container">
      <img
        src="./screenshots/focusDOM2.png"
        alt="Blocked Screen"
        height="550"
        class="borderradius20"
      />
    </div>
  </body>
</html>
