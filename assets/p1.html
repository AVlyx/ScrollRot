<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollRot Promo - Delay Feature</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1280px;
        height: 800px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #5861de 0%, #1d8fd2 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        padding: 60px;
        position: relative;
        overflow: hidden;
      }

      /* Static Bubbles */
      body::before {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        top: -100px;
        right: -100px;
      }

      body::after {
        content: "";
        position: absolute;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        bottom: -80px;
        left: -80px;
      }

      .bubble {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
      }

      .bubble:nth-child(1) {
        width: 150px;
        height: 150px;
        top: 50%;
        left: -75px;
      }

      .bubble:nth-child(2) {
        width: 250px;
        height: 250px;
        bottom: 100px;
        right: -125px;
        background: rgba(255, 255, 255, 0.07);
      }

      .bubble:nth-child(3) {
        width: 180px;
        height: 180px;
        top: 20%;
        right: 15%;
        background: rgba(255, 255, 255, 0.05);
      }

      .container {
        display: flex;
        align-items: center;
        gap: 60px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .left-content {
        flex: 1;
        color: white;
      }

      .icon {
        font-size: 80px;
        margin-bottom: 30px;
      }

      h1 {
        font-size: 64px;
        font-weight: 800;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        line-height: 1.2;
      }

      .description {
        font-size: 32px;
        font-weight: 500;
        margin-bottom: 40px;
        opacity: 0.95;
        line-height: 1.4;
      }

      .features {
        font-size: 26px;
        line-height: 1.8;
      }

      .features li {
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .features li::before {
        content: "✓";
        font-size: 32px;
        font-weight: 900;
      }

      .screenshot-placeholder {
        width: 450px;
        height: 650px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px dashed rgba(255, 255, 255, 0.4);
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .screenshot-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 17px;
      }

      .placeholder-text {
        color: rgba(255, 255, 255, 0.6);
        font-size: 24px;
        font-weight: 600;
      }

      .borderradius25 {
        border-radius: 25px;
      }
    </style>
  </head>
  <body>
    <!-- Static Bubbles -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="container">
      <div class="left-content">
        <div class="icon">⏸️</div>
        <h1>Break the Endless Scroll</h1>
        <div class="description">Add custom delays between every short video</div>
        <ul class="features">
          <li>Pause between Shorts, Reels & TikToks</li>
          <li>Customizable delay duration</li>
          <li>Grayscale</li>
          <li>Break autopilot scrolling habit</li>
        </ul>
      </div>
      <img
        src="./screenshots/pausedVid.png"
        alt="Delay Feature"
        height="600px"
        class="borderradius25"
      />
    </div>
  </body>
</html>
